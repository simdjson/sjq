<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}sjq</title>
  <meta name="description" content="sjq: a fast, jq-compatible command-line JSON processor built on simdjson">
  <style>
    :root {
      color-scheme: light;
      --bg: #f9f9f7;
      --surface: #fcfcfb;
      --ink: #0b0b0b;
      --ink2: #52514e;
      --muted: #898781;
      --line: #e1e0d9;
      --accent: #2a78d6;
      --code-bg: #f1f0ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0d0d0d;
        --surface: #1a1a19;
        --ink: #f0efec;
        --ink2: #c3c2b7;
        --muted: #898781;
        --line: #2c2c2a;
        --accent: #3987e5;
        --code-bg: #232321;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header.site {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    header.site .inner, main, footer {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header.site .inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      flex-wrap: wrap;
    }
    header.site a.brand { font-weight: 700; font-size: 18px; color: var(--ink); text-decoration: none; }
    header.site nav a { color: var(--ink2); text-decoration: none; margin-left: 16px; font-size: 14px; }
    header.site nav a:hover { color: var(--accent); }
    main { padding-top: 24px; padding-bottom: 48px; }
    h1 { font-size: 34px; line-height: 1.2; margin: 24px 0 8px; }
    h2 { font-size: 24px; margin-top: 48px; padding-top: 8px; border-top: 1px solid var(--line); }
    h3 { font-size: 18px; margin-top: 28px; }
    a { color: var(--accent); }
    p, li { color: var(--ink); }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
    pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.45; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
    th, td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
    th { color: var(--ink2); font-weight: 600; }
    td code { white-space: nowrap; }
    img, svg, picture { max-width: 100%; height: auto; }
    .lead { font-size: 19px; color: var(--ink2); margin-top: 0; }
    footer { color: var(--muted); font-size: 13px; padding-bottom: 32px; }
  </style>
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="{{ '/' | relative_url }}">sjq</a>
      <nav>
        <a href="#install">Install</a>
        <a href="#usage">Usage</a>
        <a href="#performance">Performance</a>
        <a href="#language">Language</a>
        <a href="https://github.com/simdjson/sjq">GitHub</a>
      </nav>
    </div>
  </header>
  <main>
{{ content }}
  </main>
  <footer>
    sjq is part of the <a href="https://github.com/simdjson">simdjson</a> project. Apache 2.0 or MIT.
  </footer>
</body>
</html>
